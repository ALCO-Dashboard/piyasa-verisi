<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Makro ve Piyasa Verileri · ALCO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --page:#f4f5f7; --surface:#ffffff; --surface-2:#f8f8f6; --ink:#1a1d26; --ink-2:#4f4e4a; --muted:#85837d;
  --grid:#e7e6e0; --axis:#c3c2b7; --line:rgba(11,11,11,.10); --accent:#c8102e; --accent-wash:#fdecee;
  --up:#0b7a0b; --down:#c62828; --bar:#9aa3b5; --bar-hi:#c8102e; --vol:rgba(110,120,140,.28);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#6250d6; --c7:#008300;
  --mono:"DM Mono","SF Mono",ui-monospace,Menlo,monospace; --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --page:#0f1012; --surface:#1a1a19; --surface-2:#222220; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#3d3d3a; --line:rgba(255,255,255,.10); --accent:#f0525f; --accent-wash:#3a171b;
  --up:#3fbf3f; --down:#ef6b6b; --bar:#5d6577; --bar-hi:#f0525f; --vol:rgba(160,170,190,.25);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c7:#1f9a1f;}}
:root[data-theme="dark"]{
  color-scheme:dark; --page:#0f1012; --surface:#1a1a19; --surface-2:#222220; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#3d3d3a; --line:rgba(255,255,255,.10); --accent:#f0525f; --accent-wash:#3a171b;
  --up:#3fbf3f; --down:#ef6b6b; --bar:#5d6577; --bar-hi:#f0525f; --vol:rgba(160,170,190,.25);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#9085e9; --c7:#1f9a1f;}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,select{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px}
.top .wrap{padding-block:20px 0}
.brandtitle{margin:0;font-family:Archivo,var(--sans);font-size:26px;font-weight:800;letter-spacing:.03em;line-height:1.15;text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:10px}
nav.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
nav.tabs button{font-family:Archivo,var(--sans);font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;padding:13px 10px;border:1px solid var(--line);border-bottom:3px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-wash)}
main.wrap{padding-block:16px 48px}
.subtabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-bottom:14px}
.subtabs button{border:0;background:none;padding:9px 18px;font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.subtabs button+button{border-left:1px solid var(--line)}
.subtabs button[aria-pressed="true"]{background:var(--accent);color:#fff}
h2.sec{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--kc,var(--line));border-radius:12px;padding:12px 14px;text-align:left;min-width:0}
button.kpi{cursor:pointer;width:100%}
button.kpi[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);border-top-color:var(--accent)}
.kpi .t{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.2;margin-top:4px;color:var(--ink)}
.kpi .s{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.kpi .s b{font-family:var(--mono);font-weight:500}
.kpi2 .kr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:4px}
.kpi2 .kl{font-size:12.5px;font-weight:600;color:var(--ink-2)}.kpi2 .kv{font-family:var(--mono);font-size:22px;color:var(--ink)}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:2px}
div.kpi[role="button"]{cursor:pointer}
div.kpi[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);border-top-color:var(--accent)}
.kpi .k2{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-top:3px}
.kpi .tn{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.kpi .tn button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:600;color:var(--ink-2);cursor:pointer;font-family:inherit}
.kpi .tn button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:6px 0 2px}
.ctl input[type="date"]{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font:inherit;font-size:13px}
.ctl input[type="date"].on{border-color:var(--accent);background:var(--accent-wash)}
.hdr2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.up{color:var(--up)}.down{color:var(--down)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px;min-width:0}
.cardhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.cardhead h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.cardhead .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;line-height:1.2;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);font-weight:600}
.chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chip.off{opacity:.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px 10px;font-size:12.5px;min-width:170px;z-index:5;display:none}
.tip b{display:block;font-size:12px;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:12px}
.tip .r span:first-child{font-family:var(--sans);color:var(--ink-2)}
.tip .r i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.note{font-size:12.5px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
/* TÜFE ana harcama grupları */
details.grpd{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.grpd>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
details.grpd>summary::-webkit-details-marker{display:none}
details.grpd>summary::before{content:"▸";color:var(--muted)}details.grpd[open]>summary::before{content:"▾"}
details.grpd>summary b{font-size:13.5px;text-transform:uppercase;letter-spacing:.02em}details.grpd>summary span{font-size:12.5px;color:var(--muted)}
.grph{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.grph select{border:1px solid var(--line);border-radius:9px;padding:6px 10px;background:var(--surface)}
.grp{width:100%;border-collapse:collapse;font-size:13.5px}
.grp th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.grp th:first-child{text-align:left}
.grp td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono);white-space:nowrap}
.grp td:first-child{text-align:left;font-family:var(--sans);white-space:normal}
.grp tr.tot td{font-weight:700;background:var(--surface-2)}
.hb{display:inline-block;width:110px;height:10px;position:relative;vertical-align:middle;margin-right:8px;background:var(--surface-2);border-radius:3px}
.hb i{position:absolute;top:0;bottom:0;border-radius:3px}
.hb::after{content:"";position:absolute;top:-2px;bottom:-2px;left:50%;width:1px;background:var(--axis)}
.hb.p::after{left:0}
/* hedef tablosu */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--mono)}
.tbl tr.cur td{background:var(--accent-wash)}
.tbl td.na{color:var(--muted)}
.src{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}
#gate{padding:60px 16px;text-align:center;color:var(--muted)}
.hidden{display:none!important}
@media (max-width:640px){.kpi .v{font-size:22px}.brandtitle{font-size:21px}.hb{width:60px}}
@media print{.tip{display:none!important}}
</style>
</head>
<body>
<div id="alcoTop"></div><script src="../ortak/ust.js" data-page="makro" data-root="../"></script>
<header class="top"><div class="wrap">
  <h1 class="brandtitle">Makro ve Piyasa Verileri</h1>
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="makro" aria-selected="true">Makro Veriler</button>
    <button role="tab" data-tab="piyasa" aria-selected="false">Piyasa Verileri</button>
  </nav>
</div></header>
<main class="wrap">
  <div id="gate">Veriler yükleniyor…</div>
  <section id="pMakro" class="hidden">
    <div class="subtabs" role="group" aria-label="Makro konu"><button aria-pressed="true">Enflasyon</button></div>
    <h2 class="sec">Manşet enflasyon</h2>
    <div class="kpis" id="infKpi"></div>
    <div class="card">
      <div class="cardhead"><div><h3 id="infTitle"></h3><div class="sub" id="infSub"></div></div>
        <span class="chips" id="infRange"></span></div>
      <div class="chart" id="infChart"></div>
      <div id="grpBox"></div>
    </div>
    <h2 class="sec">Hedef / tahmin</h2>
    <div class="kpis" id="bkKpi"></div>
    <div class="grid2">
      <div class="card">
        <div class="cardhead"><div><h3>Enflasyon beklentileri</h3><div class="sub">Yıllık TÜFE beklentisi (%) · gerçekleşen yıllık TÜFE ile</div></div><span class="chips" id="bkRange"></span></div>
        <div class="legend" id="bkLeg"></div>
        <div class="chart" id="bkChart"></div>
      </div>
      <div class="card">
        <div class="cardhead"><div><h3>TCMB hedef / gerçekleşme</h3><div class="sub" id="hdSub"></div></div></div>
        <div id="hdTbl"></div>
      </div>
    </div>
  </section>
  <section id="pPiyasa" class="hidden">
    <div class="subtabs" role="group" aria-label="Piyasa konu"><button aria-pressed="true">Faiz &amp; Swap</button></div>
    <h2 class="sec">Gecelik oranlar ve hacim</h2>
    <div class="kpis" id="pKpi"></div>
    <div class="card">
      <div class="cardhead"><div><h3 id="pTitle"></h3><div class="sub" id="pSub"></div></div><span class="chips" id="pRange"></span></div>
      <div class="legend" id="pLeg"></div>
      <div class="chart" id="pChart"></div>
    </div>
    <div id="bbgBox" class="hidden">
      <h2 class="sec">OIS oranları</h2>
      <div class="card">
        <div class="cardhead"><div><h3 id="oisTitle"></h3><div class="sub" id="oisSub"></div></div><div class="seg" id="oisCcy" role="group" aria-label="Para birimi"></div></div>
        <div class="ctl"><div class="legend" id="oisLeg"></div><span class="chips" id="oisRange"></span></div>
        <div class="chart" id="oisChart"></div>
      </div>
      <h2 class="sec">BIST VİOP</h2>
      <div class="card">
        <div class="cardhead"><div><h3 id="vpTitle"></h3><div class="sub" id="vpSub"></div></div>
          <div class="hdr2"><div class="seg" id="vpMod" role="group" aria-label="Gösterim"><button data-m="oran">Oran</button><button data-m="kur">Vadeli İşlem Kuru</button></div><div class="seg" id="vpSeg" role="group" aria-label="Kontrat"></div></div></div>
        <div class="chart" id="vpChart"></div>
      </div>
    </div>
  </section>
  <div class="src" id="src"></div>
</main>
<script>
(function(){
"use strict";
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const AY = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
const AYU = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const NF = {}; const nf = (v, d = 2) => (NF[d] ||= new Intl.NumberFormat("tr-TR", { minimumFractionDigits: d, maximumFractionDigits: d })).format(v);
const ok = v => v != null && isFinite(v);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const pct = (v, d = 2) => ok(v) ? (v < 0 ? "−%" : "%") + nf(Math.abs(v), d) : "—";
const ayAd = m => m ? `${AYU[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}` : "—";
const ayKisa = m => `${AY[+m.slice(5, 7) - 1]} ${m.slice(2, 4)}`;
const gunAd = d => d ? `${+d.slice(8, 10)} ${AY[+d.slice(5, 7) - 1]} ${d.slice(0, 4)}` : "—";
const gunKisa = d => `${+d.slice(8, 10)} ${AY[+d.slice(5, 7) - 1]}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
const cls = (v, e = 1e-9) => !ok(v) || Math.abs(v) < e ? "" : v > 0 ? "up" : "down";
const bp = v => { if (!ok(v)) return "—"; const b = Math.round(v * 100); return `${b > 0 ? "+" : b < 0 ? "−" : ""}${nf(Math.abs(b), 0)} bp`; };
const pp = v => ok(v) ? `${v > 0 ? "+" : v < 0 ? "−" : ""}${nf(Math.abs(v), 2)} puan` : "—";

let D = null;
const S = { tab: "makro", infOn: new Set(["tufe:yoy"]), gMode: "yoy", gOpen: false, infR: "2Y", sel: null, bkR: "3Y", pR: "6A",
  bkOn: { pk_yilsonu: 1, pk_12ay: 1, reel_12ay: 1, hh_12ay: 1, tufe: 1 }, pOn: new Set((store.get("mk.pon") || "tlref").split(",").filter(Boolean)),
  impT: "O/N", oisC: "TRY", oisV: "egri", oisR: "6A", oisCmp: null, vpK: "USDTRY", vpM: "oran" };
let B = null;     // Bloomberg (bbg.json)

// ---------------------------------------------------------------- grafik
function niceTicks(a, b, n) {
  if (a === b) { a -= 1; b += 1; }
  const step0 = (b - a) / n, mag = Math.pow(10, Math.floor(Math.log10(step0))), r = step0 / mag;
  const step = (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag, out = [];
  for (let v = Math.floor(a / step) * step; v <= b + step * 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
// xs: kategori dizisi; series: [{name,color,vals,type:'line'|'bar',axis:'l'|'r',dash,barColors}]
function chart(el, o) {
  el.innerHTML = "";
  const xs = o.xs, n = xs.length, ser = o.series.filter(s => s.vals.some(ok));
  if (!n || !ser.length) { el.innerHTML = '<div class="empty">Seçili dönemde veri yok.</div>'; return; }
  const W = Math.max(320, el.clientWidth || 700), H = o.height || 320;
  const hasR = ser.some(s => s.axis === "r");
  const m = { t: 10, r: hasR ? 58 : 14, b: 26, l: 52 };
  const ext = ax => { const v = ser.filter(s => (s.axis || "l") === ax).flatMap(s => s.vals.filter(ok)); if (!v.length) return null; let lo = Math.min(...v), hi = Math.max(...v);
    if (ser.some(s => (s.axis || "l") === ax && s.type === "bar") || o.zero) { lo = Math.min(0, lo); hi = Math.max(0, hi); }
    const pad = (hi - lo) * .08 || 1, z = ser.some(s => (s.axis || "l") === ax && s.type === "bar") || o.zero; return [z ? (lo < 0 ? lo - pad : 0) : lo - pad, hi + pad]; };
  const L = ext("l"), R = hasR ? ext("r") : null;
  const tl = L ? niceTicks(L[0], L[1], 5) : [], tr = R ? niceTicks(Math.max(0, R[0]), R[1], 5) : [];
  const yl0 = L ? Math.min(L[0], tl[0]) : 0, yl1 = L ? Math.max(L[1], tl[tl.length - 1]) : 1;
  const yr0 = R ? Math.min(Math.max(0, R[0]), tr[0]) : 0, yr1 = R ? Math.max(R[1], tr[tr.length - 1]) * (o.rScale || 1) : 1;
  const iw = W - m.l - m.r, ih = H - m.t - m.b, bw = iw / n;
  const X = i => m.l + bw * (i + .5), YL = v => m.t + (1 - (v - yl0) / (yl1 - yl0)) * ih, YR = v => m.t + (1 - (v - yr0) / (yr1 - yr0)) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Grafik")}"><g class="axis">`;
  for (const t of tl) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${YL(t)}" y2="${YL(t)}" stroke="var(--grid)"/><text x="${m.l - 7}" y="${YL(t) + 4}" text-anchor="end">${o.yFmt ? o.yFmt(t) : nf(t, 0)}</text>`;
  if (R) for (const t of tr) if (YR(t) >= m.t - 1) s += `<text x="${W - m.r + 7}" y="${YR(t) + 4}" text-anchor="start">${o.y2Fmt ? o.y2Fmt(t) : nf(t, 0)}</text>`;
  if (L && yl0 < 0 && yl1 > 0) s += `<line x1="${m.l}" x2="${W - m.r}" y1="${YL(0)}" y2="${YL(0)}" stroke="var(--axis)"/>`;
  const nx = Math.max(2, Math.min(o.maxX || 8, Math.floor(iw / 80))), step = Math.max(1, Math.ceil(n / nx));
  for (let i = n - 1; i >= 0; i -= step) s += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === n - 1 ? "end" : "middle"}">${o.xFmt ? o.xFmt(xs[i]) : xs[i]}</text>`;
  s += `<line x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}" stroke="var(--axis)"/></g>`;
  if (o.hi != null && o.hi >= 0) s += `<rect x="${(X(o.hi) - bw / 2).toFixed(2)}" y="${m.t}" width="${bw.toFixed(2)}" height="${ih}" fill="var(--accent-wash)"/><line x1="${X(o.hi)}" x2="${X(o.hi)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--accent)" stroke-dasharray="3 3" stroke-width="1"/>`;
  const bars = ser.filter(x => x.type === "bar"), nb = bars.length;

        <div class="d">${gunAd(x.t)} · Bloomberg ${esc(d.ticker || "")}</div></div>`);
      continue;
    }
    const hv = d.vol_tl ? d.vol_tl[lastIdx(d.vol_tl)] : null;
    kp.push(`<button class="kpi" data-p="${k}" aria-pressed="${on(k)}" style="--kc:var(${PCOL[k]})"><div class="t">${pAd(k)} · gecelik</div><div class="v">${pct(x.v, dg)}</div>
      <div class="s">Önceki güne göre <span class="${cls(x.v - x.p, 1e-6)}">${bp(ok(x.p) ? x.v - x.p : null)}</span>${ok(hv) ? ` · hacim <b>₺${nf(hv / 1e9, 0)} mr</b>` : ""}</div>
      <div class="d">${gunAd(x.t)} · ${PKAY[k]}</div></button>`);
  }
  $("#pKpi").innerHTML = kp.join("");
  rangeChips($("#pRange"), P_R, S.pR, k => { S.pR = k; renderPiyasa(); });
  const lines = PK.filter(k => on(k) && has(k)), tek = lines.length === 1 ? lines[0] : null;
  const bars = tek && PSEL[tek].bars.length && pSrc(tek).vol_tl?.some(ok) ? [tek] : [];
  const hepsi = PK.filter(has).every(on);
  $("#pTitle").textContent = !tek ? "Gecelik oranlar · karşılaştırma" : tek === "imp" ? `TL Implied · ${impT()[2]} (%)` : PSEL[tek].ad + (bars.length ? " · oran ve işlem hacmi" : " · oran");
  $("#pSub").textContent = tek ? PSEL[tek].not + (bars.length ? " · oran sol eksen (%), hacim sağ eksen (milyar TL)" : "")
    : "Kutulara ya da aşağıdaki düğmelere tıklayarak serileri ekleyip çıkarın" + (on("imp") ? ` · TL Implied vadesi: ${impT()[2]}` : "");
  $("#pLeg").innerHTML = PK.filter(has).map(k => `<button class="chip" data-p="${k}" aria-pressed="${on(k)}"><i style="background:var(${PCOL[k]})"></i>${pAd(k)}</button>`).join("")
    + `<button class="chip" data-p="all" aria-pressed="${hepsi}">Tümünü karşılaştır</button>`;
  const all = [...new Set([...lines, ...bars].flatMap(k => pSrc(k).dates))].sort();
  if (!all.length) { $("#pChart").innerHTML = '<div class="empty">Veri yok.</div>'; return; }
  const gun = P_R.find(r => r[0] === S.pR)[1], bas = new Date(Date.parse(all[all.length - 1]) - gun * 864e5).toISOString().slice(0, 10), xs = all.filter(d => d >= bas);
  const map = (d, k) => { const o = {}; d.dates.forEach((t, i) => o[t] = d[k][i]); return xs.map(t => o[t] ?? null); };
  const series = [];
  for (const k of bars) series.push({ name: pAd(k) + " hacim", type: "bar", axis: "r", color: css("--vol"), vals: map(pSrc(k), "vol_tl").map(v => ok(v) ? v / 1e9 : null), fmt: v => "₺" + nf(v, 1) + " mr" });
  for (const k of lines) series.push({ name: pAd(k), color: css(PCOL[k]), span: true, vals: map(pSrc(k), "rate"), fmt: v => pct(v, pDg(k)) });
  chart($("#pChart"), { xs, series, height: 340, xFmt: gun > 400 ? (d => `${AY[+d.slice(5, 7) - 1]} ${d.slice(2, 4)}`) : gunKisa, tipX: gunAd, yFmt: v => nf(v, v % 1 ? 1 : 0), y2Fmt: v => nf(v, 0), rScale: 2.2, label: $("#pTitle").textContent });
}
const pSec = k => {
  if (k === "all") { const hs = PK.filter(x => pSrc(x)?.dates?.length); S.pOn = hs.every(x => S.pOn.has(x)) ? new Set([hs[0]]) : new Set(hs); }
  else if (S.pOn.has(k)) { if (S.pOn.size > 1) S.pOn.delete(k); } else S.pOn.add(k);
  store.set("mk.pon", [...S.pOn].join(",")); renderPiyasa();
};
$("#pKpi").onclick = $("#pLeg").onclick = e => {
  const t = e.target.closest("button[data-imp]"); if (t) { S.impT = t.dataset.imp; S.pOn.add("imp"); store.set("mk.pon", [...S.pOn].join(",")); renderPiyasa(); return; }
  const b = e.target.closest("[data-p]"); if (b) pSec(b.dataset.p); };
$("#pKpi").onkeydown = e => { const b = e.target.closest('div[role="button"][data-p]'); if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pSec(b.dataset.p); } };

// ---------------------------------------------------------------- OIS (Bloomberg)
const OIS = { TRY: "TLOIS", USD: "USD OIS", EUR: "EUR OIS" };
const OIS_ON = { TRY: "TLREF", USD: "SOFR", EUR: "€STR" };
const VADE = { ON: "O/N", "O/N": "O/N", "T/N": "T/N", "1W": "1H", "2W": "2H", "1M": "1A", "2M": "2A", "3M": "3A", "6M": "6A", "9M": "9A", "1Y": "1Y", "18M": "18A", "2Y": "2Y", "3Y": "3Y", "4Y": "4Y", "5Y": "5Y", "8Y": "8Y", "10Y": "10Y", "15Y": "15Y", "30Y": "30Y" };
const VGUN = { ON: 1, "1W": 7, "2W": 14, "1M": 30, "2M": 61, "3M": 91, "6M": 182, "9M": 273, "1Y": 365, "18M": 548, "2Y": 730, "3Y": 1095, "5Y": 1825, "10Y": 3650 };
const OBTN = ["ON", "1W", "2W", "1M", "3M", "6M", "1Y", "3Y", "5Y"];
const sonSatir = t => { for (let i = t.dates.length - 1; i >= 0; i--) { const n = t.v.filter(c => ok(c[i])).length; if (n >= Math.max(1, t.v.length / 2)) return i; } return -1; };
const OCMP = [["YB", "Yılbaşı"], ["1A", "1 Ay"], ["3A", "3 Ay"], ["6A", "6 Ay"], ["1Y", "1 Yıl"]];
// karşılaştırma tarihi: hedef tarihe eşit ya da ondan önceki son dolu gün
function oisKars(t, i) {
  const c = S.oisCmp; if (!c) return null;
  const son = t.dates[i]; let hedef;
  if (c.k === "d") hedef = c.d;
  else if (c.k === "YB") hedef = `${+son.slice(0, 4) - 1}-12-31`;
  else { const ay = { "1A": 1, "3A": 3, "6A": 6, "1Y": 12 }[c.k], d = new Date(son + "T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() - ay); hedef = d.toISOString().slice(0, 10); }
  const dolu = k => t.v.filter(col => ok(col[k])).length >= Math.max(1, t.v.length / 2);
  for (let k = i - 1; k >= 0; k--) if (t.dates[k] <= hedef && dolu(k)) return k;
  for (let k = 0; k < i; k++) if (dolu(k)) return k;
  return null;
}
function renderOis() {
  const ccy = Object.keys(OIS).filter(c => B?.tablolar?.[OIS[c]]);
  if (!ccy.length) return false;
  if (!ccy.includes(S.oisC)) S.oisC = ccy[0];
  const t = B.tablolar[OIS[S.oisC]], et = t.kolonlar.map(k => k.etiket);
  if (S.oisV !== "egri" && !et.includes(S.oisV)) S.oisV = "egri";
  $("#oisCcy").innerHTML = ccy.map(c => `<button data-c="${c}" aria-pressed="${S.oisC === c}">${c}</button>`).join("");
  $("#oisLeg").innerHTML = `<button class="chip" data-v="egri" aria-pressed="${S.oisV === "egri"}">Getiri eğrisi</button>` +
    OBTN.filter(v => et.includes(v)).map(v => `<button class="chip" data-v="${v}" aria-pressed="${S.oisV === v}">${VADE[v]}</button>`).join("");
  const col = css({ TRY: "--c1", USD: "--c6", EUR: "--c3" }[S.oisC]);
  if (S.oisV === "egri") {
    const i = sonSatir(t); if (i < 0) { $("#oisRange").innerHTML = ""; $("#oisChart").innerHTML = '<div class="empty">Veri yok.</div>'; return true; }
    const son = t.dates[i], j = oisKars(t, i);
    $("#oisRange").innerHTML = `<input type="date" id="oisDt" aria-label="Karşılaştırma tarihi" min="${t.dates[0]}" max="${son}" value="${j != null ? t.dates[j] : ""}" class="${S.oisCmp?.k === "d" ? "on" : ""}">`
      + OCMP.map(([k, l]) => `<button class="chip" data-cmp="${k}" aria-pressed="${S.oisCmp?.k === k}">${l}</button>`).join("")
      + (S.oisCmp ? `<button class="chip" data-cmp="x" title="Karşılaştırmayı kaldır">✕</button>` : "");
    const xs = et.map(e => VADE[e] || e), vals = t.v.map(c => c[i]), cv = j != null ? t.v.map(c => c[j]) : null;
    const series = [{ name: gunAd(son), vals, color: col, width: 2.6, dots: true, fmt: v => pct(v, 3) }];
    if (cv) series.push({ name: gunAd(t.dates[j]), vals: cv, color: css("--muted"), width: 2, dash: "5 4", dots: true, fmt: v => pct(v, 3) });
    $("#oisTitle").textContent = `${S.oisC} OIS getiri eğrisi (%)`;
    $("#oisSub").textContent = (cv ? `${gunAd(son)} ile ${gunAd(t.dates[j])} karşılaştırması` : gunAd(son)) + ` · O/N: ${OIS_ON[S.oisC]} · Bloomberg · vadeye tıklayınca tarihsel seyir`;
    const all = [...vals, ...(cv || [])].filter(ok);
    chart($("#oisChart"), { xs, height: 300, label: $("#oisTitle").textContent, yFmt: v => nf(v, Math.max(...all) < 10 ? 2 : 1), maxX: 14,
      tipX: x => { const k = xs.indexOf(x), d = cv && ok(vals[k]) && ok(cv[k]) ? vals[k] - cv[k] : null; return x + (ok(d) ? ` · değişim ${bp(d)}` : ""); },
      series, onClick: k => { const v = et[k]; if (v) { S.oisV = v; renderOis(); } } });
  } else {
    rangeChips($("#oisRange"), P_R, S.oisR, k => { S.oisR = k; renderOis(); });
    const j = et.indexOf(S.oisV), gun = P_R.find(r => r[0] === S.oisR)[1], last = t.dates[t.dates.length - 1];
    const bas = new Date(Date.parse(last) - gun * 864e5).toISOString().slice(0, 10), ix = t.dates.map((d, i) => d >= bas ? i : -1).filter(i => i >= 0);
    const xs = ix.map(i => t.dates[i]), vals = ix.map(i => t.v[j][i]), li = lastIdx(vals);
    $("#oisTitle").textContent = `${S.oisC} OIS · ${VADE[S.oisV]} (%)`;
    $("#oisSub").textContent = `${t.kolonlar[j].ticker} · son ${li >= 0 ? pct(vals[li], 3) + " (" + gunAd(xs[li]) + ")" : "—"} · Bloomberg`;
    chart($("#oisChart"), { xs, height: 300, label: $("#oisTitle").textContent, xFmt: gun > 400 ? (d => `${AY[+d.slice(5, 7) - 1]} ${d.slice(2, 4)}`) : gunKisa, tipX: gunAd,
      yFmt: v => nf(v, v % 1 ? 1 : 0), series: [{ name: `${S.oisC} OIS ${VADE[S.oisV]}`, vals, color: col, width: 2.2, span: true, fmt: v => pct(v, 3) }] });
  }
  return true;
}
$("#oisCcy").onclick = e => { const b = e.target.closest("button[data-c]"); if (b) { S.oisC = b.dataset.c; renderOis(); } };
$("#oisLeg").onclick = e => { const b = e.target.closest("button[data-v]"); if (b) { S.oisV = b.dataset.v; renderOis(); } };
$("#oisRange").addEventListener("click", e => { const b = e.target.closest("button[data-cmp]"); if (!b) return; const k = b.dataset.cmp;
  S.oisCmp = k === "x" || S.oisCmp?.k === k ? null : { k }; renderOis(); });
$("#oisRange").addEventListener("change", e => { if (e.target.id === "oisDt") { S.oisCmp = e.target.value ? { k: "d", d: e.target.value } : null; renderOis(); } });

// ---------------------------------------------------------------- BIST VİOP (Bloomberg)
const VP = ["USDTRY", "EURTRY", "XAUTRY", "XAUUSD"], VP_OIS = { USDTRY: "USD", EURTRY: "EUR" };
function enYakinOis(ccy, gun) {
  const t = B?.tablolar?.[OIS[ccy]]; if (!t) return null; const i = sonSatir(t); if (i < 0) return null;
  let best = null; t.kolonlar.forEach((k, j) => { const g = VGUN[k.etiket], v = t.v[j][i]; if (!g || !ok(v)) return; if (!best || Math.abs(g - gun) < Math.abs(best.g - gun)) best = { g, v, et: k.etiket }; });
  return best && { ...best, tarih: t.dates[i] };
}
function renderViop() {
  const V = B?.viop, ks = VP.filter(k => V?.kontratlar?.[k]);
  if (!ks.length) return false;
  if (!ks.includes(S.vpK)) S.vpK = ks[0];
  $("#vpSeg").innerHTML = ks.map(k => `<button data-k="${k}" aria-pressed="${S.vpK === k}">${k}</button>`).join("");
  $$("#vpMod button").forEach(b => b.setAttribute("aria-pressed", b.dataset.m === S.vpM));
  const K = V.kontratlar[S.vpK], oc = VP_OIS[S.vpK], kur = S.vpM === "kur";
  const eg = Object.fromEntries(K.egri.map(p => [p.vade, p])), is = Object.fromEntries(K.islem.map(p => [p.vade, p]));
  const xs = (kur ? K.islem.map(p => p.vade) : [...new Set([...K.egri.map(p => p.vade), ...K.islem.map(p => p.vade)])]).sort();
  const hac = xs.map(d => is[d]?.hacim ?? null), series = [];
  if (hac.some(ok)) series.push({ name: "Hacim", type: "bar", axis: "r", color: css("--vol"), vals: hac, fmt: v => nf(v, 0) + " kontrat" });
  const dg = ok(K.spot) && K.spot > 1000 ? 1 : 4;
  if (kur) series.push({ name: "Vadeli işlem kuru", vals: xs.map(d => is[d]?.son ?? is[d]?.kapanis ?? null), color: css("--c1"), width: 2.4, span: true, dots: true, fmt: v => nf(v, dg) });
  else {
    const fark = xs.map(d => eg[d]?.oran ?? null);
    const vals = oc ? fark.map((f, i) => { const o = ok(f) && eg[xs[i]] ? enYakinOis(oc, eg[xs[i]].gun) : null; return o ? f + o.v : null; }) : fark;
    series.push({ name: { USDTRY: "TL oranı (SOFR dahil)", EURTRY: "TL oranı (€STR dahil)" }[S.vpK] || "Oran", vals, color: css("--c1"), width: 2.4, span: true, dots: true, fmt: v => pct(v, 2) });
  }
  $("#vpTitle").textContent = `${S.vpK} vadeli işlem eğrisi`;
  $("#vpSub").textContent = `${V.tarih ? gunAd(V.tarih) : ""} · spot kur ${ok(K.spot) ? nf(K.spot, dg) : "—"}`;
  const lv = series[series.length - 1].vals.filter(ok);
  chart($("#vpChart"), { xs, series, height: 320, label: $("#vpTitle").textContent, xFmt: d => `${AY[+d.slice(5, 7) - 1]} ${d.slice(2, 4)}`, maxX: 14,
    tipX: d => `${gunAd(d)}${eg[d] ? ` · ${eg[d].gun} gün` : ""}${is[d] ? ` · ${is[d].ticker}` : ""}`,
    yFmt: v => kur ? nf(v, Math.max(...lv) - Math.min(...lv) < 20 ? 1 : 0) : nf(v, 0), y2Fmt: v => v >= 1000 ? nf(v / 1000, v % 1000 ? 1 : 0) + " bin" : nf(v, 0), rScale: 2.2 });
  return true;
}
$("#vpMod").onclick = e => { const b = e.target.closest("button[data-m]"); if (b) { S.vpM = b.dataset.m; renderViop(); } };
$("#vpSeg").onclick = e => { const b = e.target.closest("button[data-k]"); if (b) { S.vpK = b.dataset.k; renderViop(); } };
function renderBbg() { const bx = $("#bbgBox"); bx.classList.remove("hidden"); const a = renderOis(), b = renderViop(); bx.classList.toggle("hidden", !a && !b); }

// ---------------------------------------------------------------- akış
function renderSrc() {
  const fl = (D.failed || []), f = (fl.length ? ` · son çekimde alınamayan: ${fl.join(", ")} (önceki veri gösteriliyor)` : "")
    ;
  $("#src").innerHTML = `Kaynaklar: <a href="https://veriportali.tuik.gov.tr" target="_blank" rel="noopener">TÜİK Veri Portalı</a> (TÜFE, Yİ-ÜFE) · <a href="https://evds3.tcmb.gov.tr" target="_blank" rel="noopener">TCMB EVDS</a> (Piyasa Katılımcıları Anketi, sektörel enflasyon beklentileri) · TCMB (enflasyon hedefleri, Enflasyon Raporu) · <a href="https://www.borsaistanbul.com/endeksler/tlref" target="_blank" rel="noopener">Borsa İstanbul</a> (TLREF, TLREFK) · Borsa İstanbul Repo Pazarı O/N (TCMB EVDS)${B ? ` · Bloomberg (TL implied, OIS, BIST VİOP; en yeni veri ${gunAd(B.guncel)})` : ""}. Son güncelleme ${D.updated ? new Date(D.updated).toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" }) : "—"}${f}.`;
}
function render() {
  $$("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  $("#pMakro").classList.toggle("hidden", S.tab !== "makro"); $("#pPiyasa").classList.toggle("hidden", S.tab !== "piyasa");
  if (S.tab === "makro") { renderInf(); renderBk(); } else { renderPiyasa(); renderBbg(); }
  renderSrc();
}
$("#tabs").onclick = e => { const b = e.target.closest("button[data-tab]"); if (!b) return; S.tab = b.dataset.tab; try { history.replaceState(null, "", "#" + S.tab); } catch {} render(); };
$("#infKpi").onclick = e => { const b = e.target.closest("button[data-s]"); if (!b) return; const k = b.dataset.s; S.infOn.has(k) ? S.infOn.delete(k) : S.infOn.add(k); renderInf(); };
$("#grpBox").addEventListener("click", e => { const b = e.target.closest("#gMode button[data-m]"); if (b) { e.preventDefault(); S.gMode = b.dataset.m; renderGroups(); } });
$("#grpBox").addEventListener("change", e => { if (e.target.id === "gAy") { S.sel = e.target.value; renderInf(); } });
$("#grpBox").addEventListener("toggle", e => { if (e.target.classList?.contains("grpd")) S.gOpen = e.target.open; }, true);
let rz, lw = innerWidth; addEventListener("resize", () => { if (!D || Math.abs(innerWidth - lw) < 30 && !rz) { } lw = innerWidth; clearTimeout(rz); rz = setTimeout(() => { rz = null; render(); }, 150); });
const h = location.hash.slice(1); if (h === "piyasa" || h === "makro") S.tab = h;
const bbgYukle = fetch("data/bbg.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null);
fetch("data/makro.json?t=" + Date.now(), { cache: "no-store" }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(async j => { D = j; B = await bbgYukle; $("#gate").remove(); render(); })
  .catch(e => { $("#gate").textContent = "Veriler yüklenemedi (" + e.message + "). Sayfa henüz güncellenmemiş olabilir."; });
})();
</script>
