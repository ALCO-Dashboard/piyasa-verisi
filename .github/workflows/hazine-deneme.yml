name: Hazine deneme
on:
  push:
    branches: [hazine-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pip install requests && python probe.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan hazine-deneme-veri; git rm -rqf --cached .; git add -f out; git commit -qm veri; git push -f origin hazine-deneme-veri
