name: Hazine deneme
on:
  push:
    branches: [hazine-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: |
          git fetch --depth=1 origin gh-pages
          git show FETCH_HEAD:data.json > t/data.json
          mkdir -p t/bankacilik/data && git show FETCH_HEAD:bankacilik/data/evds.json > t/bankacilik/data/evds.json
          cd t && (python3 -m http.server 8768 >/dev/null 2>&1 &) && sleep 1
          npm i playwright@1.48.2 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          mkdir -p ../out
          node tip.js 2>&1 | tee ../out/log1.txt
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan hazine-deneme-veri; git rm -rqf --cached .; git add -f out; git commit -qm veri; git push -f origin hazine-deneme-veri
