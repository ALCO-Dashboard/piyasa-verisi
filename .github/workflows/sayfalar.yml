name: Katılım ve bankacılık sayfalarını güncelle

# Her sabah BDDK haftalık/aylık bülten, TCMB EVDS (rezervler dahil) verisini çeker; katilim/ ya da bankacilik/
# klasöründe değişiklik olunca da çalışır. Yalnızca bu iki sayfayı yeniler (TEFAS verisini beklemez).
on:
  schedule:
    - cron: "15 4 * * *"      # her gün 07:15 (Türkiye saati)
    - cron: "15 13 * * 4,5"   # perşembe ve cuma 16:15: haftalık bülten genelde bu günlerde çıkar
    - cron: "40 7 3-5 * *"    # ayın 3-5'i 10:40: TÜİK enflasyon bülteni
    - cron: "45 14 * * 1-5"   # hafta içi 17:45: TLREF / repo günlük verisi
  push:
    branches: [main]
    paths:
      - "katilim/**"
      - "bankacilik/**"
      - "ortak/**"
      - "makro/**"
      - "tcmb/**"
      - "bloomberg/**"
      - "hazine/**"
      - "zk/**"
      - "ekonomi/**"
      - "ozet/**"
      - "bilanco/**"
      - "sayfa.html"
      - "sunum/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fon-detay-guncelle
  cancel-in-progress: false

jobs:
  sayfalar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gerekli paketleri kur
        run: |
          pip install requests cryptography certifi openpyxl pypdf msoffcrypto-tool xlrd pdfplumber
          npm install --no-save --no-audit --no-fund xlsx@0.18.5

      - name: Yayındaki siteyi al
        run: git clone --depth 1 -b gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site

      - name: Katılım bültenini derle
        continue-on-error: true
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: node katilim/derle.mjs site

      - name: BDDK ve EVDS verisini çek
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python bankacilik/guncelle.py --cek --site site

      - name: Makro ve piyasa verisini çek
        continue-on-error: true
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python makro/guncelle.py --site site

      - name: Bloomberg Excel dosyasını oku
        continue-on-error: true
        env:
          BBG_ANAHTAR: ${{ secrets.BBG_ANAHTAR }}
        run: |
          python bloomberg/oku.py bloomberg --out "$RUNNER_TEMP/bbg.json" --site-out site/makro/data/bbg.json || rm -f "$RUNNER_TEMP/bbg.json"

      - name: TCMB rezerv verisini çek
        continue-on-error: true
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python tcmb/guncelle.py --site site --bbg "$RUNNER_TEMP/bbg.json"

      - name: Zorunlu karşılık verisini çek (TCMB)
        continue-on-error: true
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python zk/guncelle.py --site site

      - name: Hazine borçlanma verisini çek (HMB)
        continue-on-error: true
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python hazine/guncelle.py --site site

      - name: Ekonomik göstergeleri çek (büyüme, istihdam, üretim, dış denge, bütçe)
        continue-on-error: true
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python ekonomi/guncelle.py --site site

      - name: Banka bilanço verilerini çek (KAP finansal raporlar)
        continue-on-error: true
        run: python bilanco/guncelle.py --site site

      - name: Özet sayfasını derle (göstergeler, haber akışı, veri takvimi)
        continue-on-error: true
        run: python ozet/guncelle.py --site site

      - name: Ortak dosyaları ve TEFAS sayfasını kopyala
        run: |
          mkdir -p site/ortak/lib site/sunum && cp ortak/ust.js ortak/sunum.js ortak/sunum_sablon.json ortak/sunum_katalog.json site/ortak/
          cp ortak/lib/* site/ortak/lib/ && cp sunum/sayfa.html site/sunum/index.html
          cp sayfa.html site/tefas.html
          cp ortak/kabuk.html site/index.html

      - name: Takvim kontrol zamanını yaz
        run: python -c "import sys; sys.path.insert(0,'ortak'); import datetime as d; from durum import yaz; yaz('site','',None,takvim_son=d.datetime.now(d.timezone(d.timedelta(hours=3))).isoformat(timespec='minutes'))"

      - name: Sayfayı yayınla
        if: always()
        run: |
          cd site
          git config user.name "fon-detay-bot"
          git config user.email "fon-detay-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -q -m "Katılım / bankacılık sayfaları güncellendi"
          git push origin gh-pages
