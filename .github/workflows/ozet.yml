name: Özet ve haber akışını güncelle

# Özet sekmesi: haber başlıkları (ForInvest) ve veri takvimi gün içinde saat başı yenilenir.
# Göstergeler yayındaki diğer veri dosyalarından derlenir; burada yeni veri çekilmez (birkaç saniye sürer).
on:
  schedule:
    - cron: "50 4-19 * * *"   # her gün 07:50-22:50 (Türkiye saati), saat başı
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fon-detay-guncelle
  cancel-in-progress: false

jobs:
  ozet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Yayındaki siteyi al
        run: git clone --depth 1 -b gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
      - name: Özet sayfasını derle
        run: python ozet/guncelle.py --site site
      - name: Sayfayı yayınla
        run: |
          cd site
          git config user.name "fon-detay-bot"
          git config user.email "fon-detay-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -q -m "Özet güncellendi"
          git push origin gh-pages
