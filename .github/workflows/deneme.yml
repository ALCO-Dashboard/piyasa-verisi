name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          python3 - <<'P'
          import re, time, requests
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          s = requests.Session(); s.headers["User-Agent"] = UA
          for ad, bid in [("ALB", 1693434), ("GAR", 1689152), ("VKK", 1694428), ("AKB", 1688326)]:
              h = s.get(f"https://www.kap.org.tr/tr/Bildirim/{bid}", timeout=60).text
              ek = re.findall(r'href="(https://www.kap.org.tr/tr/api/file/download/[0-9a-f]+)"[^>]*>([^<]+)', h)
              print(ad, ek[:4])
              for u, n in ek[:1]:
                  time.sleep(3); r = s.get(u, timeout=120); open(f"oz/{ad}.pdf", "wb").write(r.content); print(ad, n, len(r.content), r.headers.get("content-type"))
              time.sleep(3)
          P
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
