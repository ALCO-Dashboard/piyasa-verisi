name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL -A "$UA" -o oz/robots.txt https://www.kap.org.tr/robots.txt; cat oz/robots.txt; echo
          curl -sL -A "$UA" -o oz/kap_home.html https://www.kap.org.tr/tr/
          grep -oE '"/_next/static/[^"]+\.js"' oz/kap_home.html | head -40 > oz/js.txt; wc -l oz/js.txt
          for js in $(sed 's/"//g' oz/js.txt); do f=oz/k_$(basename $js); curl -sL -A "$UA" -o $f "https://www.kap.org.tr$js"; done
          cat oz/k_*.js 2>/dev/null | grep -oE '"/?(tr/)?api/[^"]{2,120}"|`/?(tr/)?api/[^`]{2,120}`|api/[a-zA-Z/{}$._-]{3,100}' | sort -u | head -120
          curl -sL -A "$UA" -H "Content-Type: application/json" -X POST -o oz/bc.json -w "byCriteria %{http_code} %{size_download}\n" \
            -d '{"fromDate":"2026-10-15","toDate":"2026-11-08","year":"","prd":"","term":"","ruleType":"","bdkReview":"","disclosureClass":"FR","index":"","market":"","isLate":"","subjectList":[],"mkkMemberOidList":[],"inactiveMkkMemberOidList":[],"bdkMemberOidList":[],"mainSector":"","sector":"","subSector":"","memberType":"","fromSrc":"N","srcCategory":"","discIndex":[]}' \
            https://www.kap.org.tr/tr/api/disclosure/members/byCriteria || true
          head -c 1500 oz/bc.json; echo
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
