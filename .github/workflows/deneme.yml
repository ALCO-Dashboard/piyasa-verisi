name: LBMA deneme
on:
  push:
    branches: [lbma-deneme]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -m 90 -w "\nHTTP %{http_code} %{size_download}\n" https://alco-dashboard.vercel.app/dashboard_data.json -o d.json | tail -1
          python3 -c "import json;d=json.load(open('d.json'));g=d['lbma_gold'];print(len(g),g[0],g[-3:])"
