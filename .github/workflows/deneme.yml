name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for u in https://www.resmiistatistik.gov.tr/ https://www.resmiistatistik.gov.tr/takvim https://www.resmiistatistik.gov.tr/veri-yayimlama-takvimi https://data.tuik.gov.tr/Kategori/GetTakvim https://www.tuik.gov.tr/Kurumsal/Ulusal_Veri_Yayimlama_Takvimi; do
            f=oz/$(echo $u | md5sum | cut -c1-6).html; curl -sL -A "$UA" -o $f -w "$u %{http_code} %{size_download} %{url_effective}\n" "$u" || true; sleep 2
            grep -oiE '(href|src)="[^"]*(takvim|calendar|api)[^"]*"' $f | sort -u | head -15
          done
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
