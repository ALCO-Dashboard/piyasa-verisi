name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          C="curl -sL -A \"$UA\" -c oz/cj -b oz/cj -H Accept-Language:tr-TR"
          curl -sL -A "$UA" -c oz/cj -b oz/cj -o oz/news.txt -w "news %{http_code} %{size_download}\n" https://www.foreks.com/llms-news.txt
          curl -sL -A "$UA" -c oz/cj -b oz/cj -o oz/analiz.txt -w "analiz %{http_code} %{size_download}\n" https://www.foreks.com/llms-analysis.txt
          grep -A3 "^### Ekonomik Veri Takvimi" oz/analiz.txt | grep -oE 'https://www.foreks.com/haber/detay/[^)]+' | head -3 > oz/urls.txt; cat oz/urls.txt
          n=0; for u in $(cat oz/urls.txt); do n=$((n+1)); sleep 3; curl -sL -A "$UA" -c oz/cj -b oz/cj -o oz/tk$n.html -w "tk$n %{http_code} %{size_download}\n" "$u"; done
          for p in 1 2; do sleep 2; curl -sL -A "$UA" -o oz/tcmb_$p.json "https://appg.tcmb.gov.tr/igmvytsms-dis/veriTakvimi/list?yil=2026&ay=11&lang=tr&page=$p&size=20"; done
          curl -sL -A "$UA" -o oz/tcmb_0.json "https://appg.tcmb.gov.tr/igmvytsms-dis/veriTakvimi/list?yil=2026&ay=11&lang=tr&page=0&size=20"
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
