name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL -A "$UA" -H "Accept: application/json" -o oz/takvim.json -w "takvim %{http_code} %{size_download}\n" "https://www.resmiistatistik.gov.tr/Home/GetTakvimHaberBulteniListesi?dilId=1&yil=2026"
          python3 -c "
          import json,collections
          d=json.load(open('oz/takvim.json')); print(type(d), len(d))
          print(json.dumps(d[:3],ensure_ascii=False)[:1500])
          print(collections.Counter(str(x.get('KurumAdi') or x.get('Kurum') or '') for x in d).most_common(30))
          "
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
