name: LBMA deneme
on:
  push:
    branches: [lbma-deneme]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          A="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in https://prices.lbma.org.uk/json/limited/gold_am.json https://prices.lbma.org.uk/json/today.json https://www.lbma.org.uk/prices-and-data/lbma-precious-metal-prices; do
            echo "== $u"; curl -sS -m 60 -A "$A" -H "Referer: https://www.lbma.org.uk/prices-and-data/lbma-precious-metal-prices" -w "\nHTTP %{http_code} %{size_download}\n" "$u" -o g.out | tail -1; head -c 160 g.out; echo; done
