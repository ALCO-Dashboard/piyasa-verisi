name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          C="curl -sL -A \"$UA\" -c oz/cj -b oz/cj -H Accept-Language:tr-TR"
          curl -sL -A "$UA" -c oz/cj -b oz/cj -o oz/llms.txt -w "llms %{http_code} %{size_download}\n" https://www.foreks.com/llms.txt || true
          cat oz/llms.txt | head -80
          curl -sL -A "$UA" -o oz/main.js -w "main %{http_code} %{size_download}\n" "https://veriportali.tuik.gov.tr/assets/main-C0Z3qMtl.js" || true
          grep -oE '"/?api/[^"]{2,80}"|`/?api/[^`]{2,80}`|/api/[a-zA-Z/_${}.-]{2,60}' oz/main.js | sort -u | head -80
          grep -oE '.{60}(takvim|Takvim|calendar|Calendar).{60}' oz/main.js | head -20
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
