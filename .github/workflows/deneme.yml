name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for pg in kalem-karsilastirma bildirim-sorgu beklenen-bildirim-sorgu; do
            curl -sL -A "$UA" -o oz/p_$pg.html -w "$pg %{http_code} %{size_download}\n" "https://www.kap.org.tr/tr/$pg"; sleep 2
            for js in $(grep -oE '"/_next/static/[^"]+\.js"' oz/p_$pg.html | sed 's/"//g'); do f=oz/k_$(basename $js); [ -f $f ] || { curl -sL -A "$UA" -o $f "https://www.kap.org.tr$js"; sleep 0.5; }; done
          done
          ls oz | wc -l
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
