name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL -A "$UA" -c oz/cj -b oz/cj -H "Accept-Language: tr-TR" -o oz/edevlet.html -w "edevlet %{http_code} %{size_download} %{url_effective}\n" "https://www.turkiye.gov.tr/tuik-ulusal-veri-yayimlama-takvimi" || true
          grep -o '<form[^>]*>' oz/edevlet.html | head -5; grep -o 'name="[^"]*"' oz/edevlet.html | sort -u | head -30; grep -c "<tr" oz/edevlet.html || true
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
