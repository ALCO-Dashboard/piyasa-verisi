name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          C="curl -sL -A \"$UA\" -c oz/cj -b oz/cj -H Accept-Language:tr-TR"
          curl -sL -A "$UA" -o oz/t_latest.json -w "latest %{http_code} %{size_download}\n" "https://veriportali.tuik.gov.tr/api/tr/press/latest"; sleep 5
          curl -sL -A "$UA" -o oz/t_ind.json -w "ind %{http_code} %{size_download}\n" "https://veriportali.tuik.gov.tr/api/tr/indicators"; sleep 5
          curl -sL -A "$UA" -o oz/t_press.json -w "press %{http_code} %{size_download}\n" "https://veriportali.tuik.gov.tr/api/tr/press"
          for f in llms-analysis llms-market; do curl -sL -A "$UA" -c oz/cj -b oz/cj -o oz/$f.txt -w "$f %{http_code} %{size_download}\n" https://www.foreks.com/$f.txt; head -c 1500 oz/$f.txt; echo; grep -n -i "takvim" oz/$f.txt | head; done
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
