name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL -A "$UA" -o oz/main.js -w "main %{http_code} %{size_download}\n" "https://www.resmiistatistik.gov.tr/static/js/main.js?ver=5"
          grep -oE 'https?://[a-zA-Z0-9./_-]{8,120}' oz/main.js | sort -u | grep -v -E "w3.org|reactjs|fb.me|mui|github" | head -40
          grep -oE '"/?[a-zA-Z/_-]*(api|Api|takvim|Takvim|calendar|Calendar)[a-zA-Z/_?=&{}$.-]{0,80}"' oz/main.js | sort -u | head -60
          grep -oE '`[^`]{0,40}(api|Api|takvim|Takvim)[^`]{0,100}`' oz/main.js | sort -u | head -30
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
