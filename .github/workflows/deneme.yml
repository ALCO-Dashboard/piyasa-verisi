name: TÜİK deneme
on:
  push:
    branches: [tuik-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl xlrd
      - env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          python ekonomi/guncelle.py --site out
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan tuik-deneme-veri; git rm -rq --cached .; git add -f out; git commit -qm veri; git push -f origin tuik-deneme-veri
