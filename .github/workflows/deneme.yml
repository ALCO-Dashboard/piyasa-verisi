name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL -A "$UA" -o oz/b1.html -w "bildirim %{http_code} %{size_download}\n" "https://www.kap.org.tr/tr/Bildirim/1693434"
          for w in "Kâr Payı Gelirleri" "Kredilerden" "Toplanan Fonlar" "Vadesiz" "BİLANÇO" "KÂR VEYA ZARAR"; do echo "$w: $(grep -o "$w" oz/b1.html | wc -l)"; done
          grep -oE '"/_next/static/[^"]+\.js"' oz/b1.html | wc -l
          grep -oE '.{0,200}Kâr Payı Gelirleri.{0,400}' oz/b1.html | head -3
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
