name: Özet deneme
on:
  push:
    branches: [ozet-deneme]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          mkdir -p oz
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          H=(-A "$UA" -H "Accept: text/html,application/xhtml+xml,*/*;q=0.8" -H "Accept-Language: tr-TR,tr;q=0.9" -c oz/cj -b oz/cj --max-redirs 5)
          curl -sI "${H[@]}" https://www.foreks.com/haberler/ | head -20 || true
          for u in https://www.foreks.com/haberler/ https://www.foreks.com/haberler https://foreks.com/haberler/ https://www.foreks.com/llms-news.txt https://www.foreks.com/llms.txt; do
            n=$(echo "$u" | tr -c 'a-z0-9' '_'); curl -sL "${H[@]}" -o "oz/$n" -w "GET $u -> %{http_code} %{size_download} %{num_redirects} %{url_effective}\n" "$u" || echo "GET $u başarısız $?"; sleep 2; done
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git checkout --orphan ozet-deneme-veri; git rm -rq --cached .; git add -f oz; git commit -qm veri; git push -f origin ozet-deneme-veri
