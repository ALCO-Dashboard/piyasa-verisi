.ppboxes{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.ppbox{flex:1 1 150px;min-width:0;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--bc);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;cursor:pointer}
.ppbox:hover{border-color:var(--bc)}
.ppbox[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--bc)}
.ppbox .pl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.ppbox .pv{font-family:var(--mono);font-size:22px;font-weight:600;color:var(--ink);line-height:1.2}
.ppbox .pv.neg,.pptile b.neg{color:var(--down)}
.ppbox .ps{font-size:10.5px;color:var(--muted);line-height:1.3}
.ppbox .pd{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.ppdef{display:flex;flex-direction:column;gap:8px}.ppdefh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ppkgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media (max-width:900px){.ppkgrid2{grid-template-columns:minmax(0,1fr)}}
.ppkgrid2 h3{margin:0 0 6px;font-size:15px}
.ppsel{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);cursor:pointer}
.ppop{align-self:center;font-size:20px;font-weight:700;color:var(--muted);padding:0 2px}
.ppsep{width:1px;background:var(--line);margin:0 4px}
.ppchart .ppch,.ppcalh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.ppchart h3,.ppk h3{margin:0;font-size:15px}
.pptiles{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.pptile{flex:1 1 180px;min-width:0;border:1px solid var(--line);border-left:3px solid var(--bc,var(--accent));border-radius:10px;padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;background:var(--surface-2)}
.pptile .tt{grid-column:1/-1;font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.pptile .tt i{width:9px;height:9px;border-radius:2px;background:var(--bc,var(--accent));flex:none}
.pptile b{font-family:var(--mono);font-size:16px;font-weight:600}
.pptile .tr{font-family:var(--mono);font-size:13px;color:var(--ink-2);align-self:end}
.ppnote{font-size:12px;color:var(--muted);margin:8px 0 0}
.ppkgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,2fr);gap:14px}
@media (max-width:900px){.ppkgrid{grid-template-columns:minmax(0,1fr)}}
.tscroll{overflow-x:auto}
.pptab{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.pptab th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.pptab td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pptab .num{text-align:right;font-family:var(--mono)}
.pptab th:nth-child(2),.pptab td:nth-child(2){text-align:right}
.pptab td.up{color:var(--up);font-weight:600}.pptab td.down{color:var(--down);font-weight:600}
.pptab tr.next td{background:var(--accent-wash)}
.pptab a{color:var(--accent);text-decoration:none}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:4px;background:var(--accent);color:#fff;vertical-align:1px}
.ppsum{font-size:13px;color:var(--ink-2);margin:8px 0}
.ppcl{list-style:none;margin:0;padding:0;cursor:pointer}
.ppcl li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:2px 8px;padding:7px 4px;border-bottom:1px solid var(--line)}
.ppcl li:last-child{border-bottom:0}
.ppcl .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:var(--axis)}
.ppcl li.past .dot{background:var(--up)}.ppcl li.today .dot{background:var(--accent)}
.ppcl .dd{font-size:13px;color:var(--ink)}
.ppcl .kk{grid-column:2;font-size:12px;font-family:var(--mono);color:var(--ink-2)}
.ppcl li.future .dd{color:var(--muted)}

<meta name="robots" content="noindex, nofollow">
<title>ALCO - Bankacılık Verileri</title>

<style>
/* Düzen: üst başlık + kaynak sekmeleri (BDDK / TCMB / Tüm); her sekmede kontrol çubuğu, altında kartlar. */
:root{
  color-scheme:light;
  --page:#f4f5f7; --surface:#ffffff; --surface-2:#f8f8f6; --ink:#1a1d26; --ink-2:#4f4e4a; --muted:#85837d;
  --grid:#e7e6e0; --axis:#c3c2b7; --line:rgba(11,11,11,.10); --accent:#c8102e; --accent-wash:#fdecee;
  --up:#0b7a0b; --down:#c62828; --up-bar:#2e9b4f; --down-bar:#d9534f;
  --g-sektor:#2a78d6; --g-katilim:#eb6834; --g-kamu:#1baf7a; --g-ozel:#eda100; --g-yabanci:#e87ba4; --g-mevduat:#008300; --g-kalkinma:#6250d6;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --mono:"DM Mono","SF Mono",ui-monospace,Menlo,monospace; --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --page:#0f1012; --surface:#1a1a19; --surface-2:#222220; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#3d3d3a; --line:rgba(255,255,255,.10); --accent:#f0525f; --accent-wash:#3a171b;
  --up:#3fbf3f; --down:#ef6b6b; --up-bar:#3aa95c; --down-bar:#e06565;
  --g-sektor:#3987e5; --g-katilim:#d95926; --g-kamu:#199e70; --g-ozel:#c98500; --g-yabanci:#d55181; --g-mevduat:#1f9a1f; --g-kalkinma:#9085e9;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#1f9a1f; --c7:#9085e9; --c8:#e66767;}}
:root[data-theme="dark"]{
  color-scheme:dark; --page:#0f1012; --surface:#1a1a19; --surface-2:#222220; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#8f8d86;
  --grid:#2c2c2a; --axis:#3d3d3a; --line:rgba(255,255,255,.10); --accent:#f0525f; --accent-wash:#3a171b;
  --up:#3fbf3f; --down:#ef6b6b; --up-bar:#3aa95c; --down-bar:#e06565;
  --g-sektor:#3987e5; --g-katilim:#d95926; --g-kamu:#199e70; --g-ozel:#c98500; --g-yabanci:#d55181; --g-mevduat:#1f9a1f; --g-kalkinma:#9085e9;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#1f9a1f; --c7:#9085e9; --c8:#e66767;}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-inline:16px}
header.top{background:transparent}
.top .wrap{padding-block:20px 0}
.brandtitle{margin:0;font-family:Archivo,var(--sans);font-size:26px;font-weight:800;letter-spacing:.03em;line-height:1.15;text-transform:uppercase;text-wrap:balance;border-bottom:2px solid var(--ink);padding-bottom:10px}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--ink-2)}
.pill b{font-family:var(--mono);color:var(--ink);font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:12px}
nav.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:700px){nav.tabs{gap:8px}}
nav.tabs button{font-family:Archivo,var(--sans);font-weight:700;font-size:15px;letter-spacing:.02em;text-transform:uppercase;text-align:center;padding:13px 10px;border:1px solid var(--line);border-bottom:3px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer}
nav.tabs button small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent);background:var(--accent-wash)}
main.wrap{padding-block:16px 48px}
.note{font-size:13px;color:var(--muted)}
.notice{display:block;line-height:1.5;margin-bottom:14px}
.bar{display:flex;gap:8px 10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.bar .lbl,.ppdefh .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
.chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);flex-wrap:wrap}
.seg button{border:0;background:none;padding:9px 16px;cursor:pointer;font-weight:600;color:var(--ink-2);font-size:14.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;max-width:100%;font-size:14.5px}
input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;width:100%}
.period{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.period .arrow{color:var(--muted)}
.period .span{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-2)}
.card .sub{font-size:13px;color:var(--muted)}
.stack{display:grid;gap:12px}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.headline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:4px 0 10px}
.headline .big{font:700 30px/1.15 var(--mono);letter-spacing:-.02em}
.headline .pc{font:500 16px var(--mono)}
.headline .lvl{font-size:14px;color:var(--muted)}
.headline .lvl b{font-family:var(--mono);font-weight:500;color:var(--ink-2)}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.up{color:var(--up)} .down{color:var(--down)}
.tdata .tdb{display:flex;justify-content:flex-end;margin-top:4px}
.fdgw{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin:0 0 10px}
.fdgt{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.fdg{max-width:100%;min-width:0;display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12.5px;background:var(--surface)}
.fdg i{width:8px;height:8px;border-radius:50%;display:inline-block;align-self:center}
.fdg .nm{min-width:0;flex:0 1 auto;color:var(--ink-2);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdg b{font:600 12.5px var(--mono)}.fdg small{font:500 11.5px var(--mono)}
.fdg .up,.tdd2 .up{color:var(--up)}.fdg .down,.tdd2 .down{color:var(--down)}
.tdd2 td.l,.tdd2 th.l{text-align:left;white-space:normal}.tdd2 td.l i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tdw{margin-top:8px;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tdw table{font-size:11.5px;width:100%;border-collapse:collapse}
.tdw th,.tdw td{padding:4px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tdw th{text-transform:none;letter-spacing:0;position:sticky;top:0;background:var(--surface);font-weight:600;white-space:normal;min-width:90px;vertical-align:bottom;font-size:11px;line-height:1.25}
.tdw th:first-child,.tdw td:first-child{text-align:left;color:var(--muted);min-width:70px}
.tdw th i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.btag{display:inline-flex;align-items:center;gap:5px;margin-left:10px;font-size:11.5px;font-weight:600;letter-spacing:.02em;text-transform:none;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:2px 8px;vertical-align:2px}
.btag .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.seg.trate{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-right:4px}
.seg.trate button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg.trate button+button{border-left:1px solid var(--line)}.seg.trate button[aria-pressed="true"]{background:var(--accent);color:#fff}
.fhead{align-items:flex-start}.fson{margin-top:4px;font-size:12px;color:var(--muted)}.sub.fnot{margin:6px 0 0;font-size:12px}.fttl{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}.fttl h3{margin:0}
svg text.yunit{font-family:var(--sans,inherit);font-size:10.5px;fill:var(--muted)}
.ftur{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.ftur .chip.sm{font-size:12.5px;padding:4px 12px}
.fbank{display:flex;flex-wrap:wrap;gap:6px}.fbank .dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.frow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin:4px 0 10px}
.trng{display:flex;flex-wrap:wrap;align-items:center;gap:4px}.trng .chip.sm{font-size:11.5px;padding:3px 9px}
.prng .period select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.trng .tdt{font:inherit;font-size:12px;padding:2px 6px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.trng .arrow{color:var(--muted);font-size:12px}
.fcmp table{font-size:12.5px}
.fcmp td,.fcmp th{padding-top:5px;padding-bottom:5px}
.fcmp td.nm,.fcmp th.chk+th{text-align:right;padding-left:8px!important;font-size:12.5px;white-space:normal}
.fcmp td.nm small{color:var(--muted);font-size:11px}
.fcmp td:not(.nm):not(.chk){white-space:nowrap;width:1%}
.fcmp .gb{border-left:1px solid var(--line)}
.fcmp tr.gh th{text-align:center;font-size:11.5px;color:var(--ink-2)}.fcmp tr.gh .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.tbl-wrap tr.grp td{background:var(--surface-2);font-weight:700;font-size:12.5px;color:var(--ink-2)}.tbl-wrap tr.grp .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.tflt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:2px 0 10px}
.tflt .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.tflt .seg button{border:0;background:none;padding:7px 18px;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.tflt .seg button+button{border-left:1px solid var(--line)}
.tflt .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ttyp{display:flex;flex-wrap:wrap;gap:6px}.chip.sm{font-size:12px;padding:3px 10px}
details.tser{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
details.tser>summary{cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:baseline;gap:8px}
details.tser>summary::-webkit-details-marker{display:none}
details.tser>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
details.tser[open]>summary::before{transform:rotate(90deg)}
details.tser>summary span{font-weight:400;font-size:12px;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);max-width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--grid);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);font-weight:700;color:var(--muted);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;z-index:1}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-family:var(--sans);white-space:normal;min-width:220px}
th.chk,td.chk{min-width:0!important;width:1%;padding-left:10px!important;padding-right:0!important}
td.chk input{margin:0;vertical-align:middle}
th.chk+th{text-align:left}
td.chk+td{padding-left:8px}
tr.l2 td.chk+td.nm{padding-left:22px}
tr.l3 td.chk+td.nm{padding-left:34px}
td.chk+td{text-align:left;font-family:var(--sans);white-space:normal;min-width:220px}
tr.l0 td.nm{font-weight:700}
tr.l2 td.nm{padding-left:26px;color:var(--ink-2)}
tr.l3 td.nm{padding-left:40px;color:var(--ink-2)}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--accent-wash)}
tbody tr.sel{background:var(--accent-wash)}
tr.detail td{background:var(--surface-2);cursor:default;white-space:normal}
td.na{color:var(--muted)}
td .sm{color:var(--muted);font-size:11px;margin-left:6px}
td .sm.up{color:var(--up)} td .sm.down{color:var(--down)}
.bctl{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.bctl .brow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.bctl .period select{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.bctl .chip{font-size:13px;padding:5px 11px}
.bctl .gch{border-radius:12px;padding:6px 14px 6px 12px;align-items:flex-start;min-width:118px}
.bctl .gch .dot{margin-top:5px}
.bctl .gch .gl{display:flex;flex-direction:column;gap:2px;text-align:left}
.bctl .gch small{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap}
.bctl .gch small.up{color:var(--up)}.bctl .gch small.down{color:var(--down)}
.bctl .seg button{padding:5px 14px;font-size:13px}
.bcur{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.bcur .seg button{padding:5px 14px;font-size:13px}
.btitle{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap}
.btitle .headline{margin:0}

<script>

// =============================================================== yardımcılar

// Birim türleri: tl (milyon TL), usd (milyon USD), pct (%), count (adet), idx (endeks/diğer)
function fmtVal(v, kind, signed = false) {
  if (!ok(v)) return "—";
  const s = signed ? sgnOf(v, 2) : (v < 0 ? "−" : ""), a = Math.abs(v);
  if (kind === "tl" || kind === "usd") {
    const cur = kind === "tl" ? "₺" : "$";
    if (a >= 1e6) return `${s}${nf(2).format(a / 1e6)} trn ${cur}`;
    if (a >= 1e3) return `${s}${nf(1).format(a / 1e3)} mr ${cur}`;
    if (a >= 1) return `${s}${nf(0).format(a)} mn ${cur}`;

// =============================================================== şifre ve veri

const FILES = ["bddk_haftalik", "bddk_aylik", "evds", "politika", "yv"];
async function fetchJSON(u) { const r = await fetch(u, { cache: "no-cache" }); if (!r.ok) throw new Error(r.status); return r.json(); }

// =============================================================== durum
const S = {
  tab: "bddk",

{ const r = store.get("bv.trange"); if (r && (r === "Tarih" || T_RANGES_K.includes(r))) S.tRange = r; }
